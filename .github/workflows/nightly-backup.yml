name: nightly-backup

# A COPY OF THE DATABASE THAT NEON CANNOT TAKE AWAY, AND A RESTORE TEST EVERY NIGHT.
#
# On 2026-09-30 the Neon project hit an account quota and refused EVERY query for a day. The database
# was unreachable and so was Neon's own restore — a copy inside the account that locks you out is not
# a second copy. This job keeps one outside it, and proves it restores.
#
# WHAT IT DOES, in order:
#   1. pg_dump the live database (direct endpoint — never the pooler)
#   2. write a manifest beside it: every table's row count, the applied-migration count, and the June
#      2026 ledger golden (scripts/_june-golden) — what the source contained at dump time
#   3. encrypt both with a passphrase that lives in GitHub, never in the bucket
#   4. upload to R2 under nightly/ weekly/ monthly/ (scripts/_backup-compare::retentionPrefix)
#   5. RESTORE the encrypted dump into a throwaway Postgres 18 and verify it reproduces the manifest
#      exactly — same tables, same row counts, same June hash. A backup nobody has restored is a
#      hypothesis, so every night is a restore test and a failure here fails the job.
#
# THIS REPOSITORY IS PUBLIC, so its Actions logs are public. Nothing here echoes a connection string,
# a passphrase or a row: the log prints table counts, byte sizes and a hash prefix, and that is all.
# Secrets are masked by GitHub, but the rule is not to print them in the first place.
#
# SECRETS REQUIRED (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL   the DIRECT (unpooled) Neon connection string, read-only role if you make one
#   BACKUP_PASSPHRASE     symmetric key for the dump; keep a copy somewhere that is NOT R2 and NOT GitHub
#   R2_ACCOUNT_ID         Cloudflare account id
#   R2_ACCESS_KEY_ID      scoped to the backup bucket ONLY — not the photos bucket, not account-wide
#   R2_SECRET_ACCESS_KEY  its secret
#   R2_BUCKET             e.g. greasedesk-db-backups, with versioning ON and lifecycle per prefix
#
# RETENTION is R2 lifecycle, by prefix, not this workflow's business: nightly/ 14 days, weekly/ 8
# weeks, monthly/ 12 months. Versioning on, so a leaked key cannot erase history by overwriting.
#
# RESTORING FOR REAL: docs/RESTORE.md.

on:
  schedule:
    - cron: '17 2 * * *'   # 02:17 UTC — after the garage's day, before anyone's morning
  workflow_dispatch:        # and on demand, which is also how you rehearse it

permissions:
  contents: read

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # The restore target. Postgres 18 because the source is 18.6 — a dump restored by an older
      # server is not the thing we are promising to be able to restore.
      verify_db:
        image: postgres:18
        env:
          # NO PASSWORD, BY DESIGN. This container is reachable only from inside this job and is
          # destroyed with it, so a password here protects nothing and only puts a credential-shaped
          # string in a public repository — which it did: the connection URI below failed the
          # secret scan on every push from 2026-10-01 to 2026-10-12. `trust` removes the string
          # rather than explaining it away.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: verify
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      # ── WHICH SECRETS CAN THIS JOB ACTUALLY SEE? ──────────────────────────────────────────────
      # FIRST step, before checkout, so a missing secret costs seconds instead of a minute — and so
      # ALL SIX are named in one run. Nine consecutive nights failed one cause at a time, each night
      # reporting only the first thing it tripped over; discovering six secrets six nights apart is
      # not a diagnosis, it is a queue.
      #
      # It also replaces a refusal that named the wrong conclusion. With an empty connection string
      # pg_dump falls back to a local Unix socket and reports
      #   "connection to server on socket /var/run/postgresql/.s.PGSQL.5432 failed: No such file or
      #    directory ... Is the server running locally?"
      # which reads as a networking fault and is in fact an unset variable. Four nights were spent
      # believing the first sentence.
      #
      # NO VALUE IS EVER PRINTED — not a length, not a prefix. This repository is PUBLIC. Only
      # present/MISSING per name, and two shape booleans on the connection string. GitHub masks
      # secret values as *** anyway; this step is written so there is nothing to mask.
      - name: Preflight — which secrets are visible to this job
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Deliberately NOT -e: every missing name must be reported, not only the first.
          set -uo pipefail
          missing=0
          for n in BACKUP_DATABASE_URL BACKUP_PASSPHRASE R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!n:-}" ]; then
              echo "  MISSING  $n"
              missing=$((missing + 1))
            else
              echo "  present  $n"
            fi
          done

          # Shape, not content. A secret that is SET but wrong fails later with a worse message.
          if [ -n "${BACKUP_DATABASE_URL:-}" ]; then
            case "$BACKUP_DATABASE_URL" in
              postgres://*|postgresql://*) echo "  shape    BACKUP_DATABASE_URL scheme ok" ;;
              *) echo "::error::BACKUP_DATABASE_URL is set but does not begin postgres:// or postgresql://"; missing=$((missing + 1)) ;;
            esac
            # pg_dump cannot use the pooler: it needs a plain session, and the header says so.
            case "$BACKUP_DATABASE_URL" in
              *-pooler.*) echo "::error::BACKUP_DATABASE_URL points at the POOLER. pg_dump needs the DIRECT endpoint."; missing=$((missing + 1)) ;;
              *) echo "  shape    BACKUP_DATABASE_URL is not the pooler host" ;;
            esac
          fi

          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing secret(s) are missing or malformed for this job — see the list above. Nothing was dumped."
            echo "A name printed MISSING above is EMPTY as this job sees it. Four things produce that:"
            echo "  1. the name differs from the workflow's (it reads secrets.BACKUP_DATABASE_URL etc., exactly)"
            echo "  2. it is an ENVIRONMENT secret, and this job declares no 'environment:', so it cannot see one"
            echo "  3. it is an ORGANISATION secret whose repository-access policy excludes this repo"
            echo "  4. it is a VARIABLE (vars.*) rather than a SECRET (secrets.*)"
            exit 1
          fi
          echo "all six secrets are visible to this job"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Postgres 18 client
        run: |
          set -euo pipefail
          # ── INSTALLING THE CLIENT IS NOT THE SAME AS USING IT ──────────────────────────────────
          # The runner image ships postgresql-client-16 and it stays FIRST on PATH, so for three
          # nights this step's own `pg_dump --version` printed 16.15 immediately after installing
          # 18 — and nobody read it, because the step still exited 0. pg_dump REFUSES to dump a
          # server newer than itself, so against Neon's 18.6 the backup would have aborted on a
          # version mismatch the moment the connection string arrived: one fixed defect revealing
          # the next. The same applies to the verify step's pg_restore.
          #
          # ONE NUMBER, THREE USES: the package, the PATH, and the assertion below cannot disagree.
          PGMAJOR=18
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PGMAJOR}"
          # GITHUB_PATH so EVERY later step gets it (the dump and the verify restore both need it);
          # the export is for the assertion in this step, which runs before GITHUB_PATH takes effect.
          echo "/usr/lib/postgresql/${PGMAJOR}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${PGMAJOR}/bin:$PATH"
          # ASSERT, do not merely print. A version line nobody reads is how this hid for three runs;
          # a wrong client now fails HERE, named, instead of as a mismatch abort two steps later.
          # Raising PGMAJOR is required when Neon's major moves: the client must be >= the server.
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -qE "^pg_dump \(PostgreSQL\) ${PGMAJOR}\." \
            || { echo "::error::pg_dump is not ${PGMAJOR}.x — got $(pg_dump --version). Client 16 is still winning on PATH."; exit 1; }
          pg_restore --version | grep -qE "^pg_restore \(PostgreSQL\) ${PGMAJOR}\." \
            || { echo "::error::pg_restore is not ${PGMAJOR}.x — got $(pg_restore --version)."; exit 1; }

      - run: npm ci
      - run: npx prisma generate

      - name: Dump and describe the source
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          STAMP="$(date -u '+%Y%m%dT%H%M%SZ')"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "BACKUP_STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          # --no-owner/--no-privileges: the restore target has different roles, and a dump that only
          # restores onto an identically-roled server is a dump that does not restore.
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="db-$STAMP.dump"
          # IMMEDIATELY after pg_dump, before anything that can fail. This line is the ONLY evidence
          # the dump did anything at all, and it used to sit after the manifest script: the first run
          # that ever reached pg_dump then failed in the manifest, so the size was never printed and
          # the file died with the runner. The one measurement, gated behind the likeliest failure.
          ls -l "db-$STAMP.dump" | awk '{print "dump bytes:", $5}'
          node scripts/backup-manifest.mjs "manifest-$STAMP.json"

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # The passphrase reaches gpg on a file descriptor, never as an argument — argv is visible
          # to every process on the runner.
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --quiet --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 --output "db-$STAMP.dump.gpg" "db-$STAMP.dump"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --quiet --symmetric --cipher-algo AES256 \
            --passphrase-fd 0 --output "manifest-$STAMP.json.gpg" "manifest-$STAMP.json"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          PREFIX="$(node -e "import('./scripts/_backup-compare.mjs').then(m => console.log(m.retentionPrefix(new Date())))")"
          echo "landing under: $PREFIX/"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "db-$STAMP.dump.gpg"        "s3://$R2_BUCKET/$PREFIX/db-$STAMP.dump.gpg"        --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 cp "manifest-$STAMP.json.gpg"  "s3://$R2_BUCKET/$PREFIX/manifest-$STAMP.json.gpg"  --endpoint-url "$ENDPOINT" --only-show-errors
          echo "uploaded $PREFIX/db-$STAMP.dump.gpg"
          echo "BACKUP_OBJECT_KEY=$PREFIX/db-$STAMP.dump.gpg" >> "$GITHUB_ENV"

      - name: Restore the UPLOADED copy, and verify it
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          # The RESTORED copy, not the source. Nothing in this step can reach Neon.
          DATABASE_URL: postgresql://postgres@localhost:5432/verify
        run: |
          set -euo pipefail
          PREFIX="$(node -e "import('./scripts/_backup-compare.mjs').then(m => console.log(m.retentionPrefix(new Date())))")"
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # PULLED BACK DOWN deliberately: verifying the local file would prove the dump good and say
          # nothing about what reached the bucket — the transfer is part of what can break.
          rm -f "db-$STAMP.dump" "db-$STAMP.dump.gpg"
          aws s3 cp "s3://$R2_BUCKET/$PREFIX/db-$STAMP.dump.gpg" "roundtrip.dump.gpg" --endpoint-url "$ENDPOINT" --only-show-errors
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --quiet --decrypt --passphrase-fd 0 --output roundtrip.dump roundtrip.dump.gpg
          pg_restore --no-owner --no-privileges --dbname "$DATABASE_URL" roundtrip.dump
          node scripts/backup-verify.mjs "manifest-$STAMP.json"

      # ── TELL THE APP. Until this existed, a backup left only a GitHub Actions run, and eleven
      # consecutive failures in September were invisible to everyone who was not looking at a tab.
      - name: Report the verified run
        env:
          BACKUP_RUN_URL: ${{ secrets.BACKUP_RUN_URL }}
          BACKUP_RUN_TOKEN: ${{ secrets.BACKUP_RUN_TOKEN }}
          PGMAJOR: '18'
        run: node scripts/backup-report.mjs verified

      # `if: failure()` AND `always()` on the report would double-post; this one runs only when an
      # earlier step gave up, and names which one. `${{ job.status }}` is not specific enough to act
      # on, so the step that failed is read from the step outcomes GitHub already tracks.
      - name: Report the failure
        if: failure()
        env:
          BACKUP_RUN_URL: ${{ secrets.BACKUP_RUN_URL }}
          BACKUP_RUN_TOKEN: ${{ secrets.BACKUP_RUN_TOKEN }}
          PGMAJOR: '18'
        run: |
          # FIRST failure wins. A chain of `|| STEP=...` lets the LAST check overwrite the others,
          # so a dump that never ran would be reported as a failed download — every later artefact
          # is missing too. Ordered earliest-to-latest, stopping at the first thing absent.
          if   [ -z "${STAMP:-}" ];                 then STEP="dump — never started, so no stamp was assigned"
          elif [ ! -f "manifest-$STAMP.json" ];     then STEP="dump or manifest"
          elif [ ! -f "db-$STAMP.dump.gpg" ] && [ -z "${BACKUP_OBJECT_KEY:-}" ]; then STEP="encrypt"
          elif [ -z "${BACKUP_OBJECT_KEY:-}" ];     then STEP="upload to R2"
          elif [ ! -f "roundtrip.dump.gpg" ];       then STEP="download back from R2"
          else STEP="restore or verify"
          fi
          node scripts/backup-report.mjs failed "$STEP"

      - name: Keep the manifests when something went wrong
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backup-manifests-${{ env.STAMP }}
          path: |
            manifest-*.json
            restored-manifest.json
          if-no-files-found: ignore
          retention-days: 14
